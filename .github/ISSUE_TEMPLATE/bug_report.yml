name: Bug report
description: Report a reproducible problem with the add-on
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Please search existing issues first. Do not attach confidential or copyrighted project files."
  - type: input
    id: blender-version
    attributes:
      label: Blender version
      placeholder: "For example, 4.5.0"
    validations:
      required: true
  - type: input
    id: addon-version
    attributes:
      label: Add-on version
      placeholder: "For example, 0.1.0"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the exact steps and the expected versus actual result.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console output or traceback
      render: text
