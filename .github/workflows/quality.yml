name: Python quality checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile add-on source
        run: python -m compileall -q blender_game_asset_optimizer
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
